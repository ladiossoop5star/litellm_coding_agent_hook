services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./opencode_compat_hook:/app/opencode_compat_hook:ro
      - ./backports/pr34462/site-packages/litellm/litellm_core_utils/prompt_templates/common_utils.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/prompt_templates/common_utils.py:ro
      - ./backports/pr34462/site-packages/litellm/llms/anthropic/experimental_pass_through/adapters/transformation.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/anthropic/experimental_pass_through/adapters/transformation.py:ro
      - ./backports/pr34462/site-packages/litellm/llms/openai/chat/gpt_transformation.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/openai/chat/gpt_transformation.py:ro
      - ./backports/pr34462/site-packages/litellm/types/llms/openai.py:/app/.venv/lib/python3.13/site-packages/litellm/types/llms/openai.py:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
      - "--num_workers"
      - "2"
      - "--timeout_worker_healthcheck"
      - "60"
